version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: argofarm-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-argofarm}
      MYSQL_USER: ${DB_USER:-argofarm}
      MYSQL_PASSWORD: ${DB_PASSWORD:-argofarm123}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - argofarm-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: argofarm-backend
    environment:
      FLASK_APP: app.py
      FLASK_ENV: ${FLASK_ENV:-production}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-argofarm}
      DB_USER: ${DB_USER:-argofarm}
      DB_PASSWORD: ${DB_PASSWORD:-argofarm123}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      UPLOAD_FOLDER: /app/static/uploads
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./backend:/app
    networks:
      - argofarm-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: argofarm-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - argofarm-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: argofarm-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - argofarm-network
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

networks:
  argofarm-network:
    driver: bridge

volumes:
  mysql_data: