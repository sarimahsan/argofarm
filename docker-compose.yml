services:
  db:
    image: mysql:8.0
    container_name: argofarm-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: argofarm
      MYSQL_USER: argofarm
      MYSQL_PASSWORD: argofarm123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - argofarm-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: argofarm-backend
    environment:
      FLASK_APP: app.py
      FLASK_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: argofarm
      DB_USER: argofarm
      DB_PASSWORD: argofarm123
      JWT_SECRET: your-secret-key-change-in-production
    ports:
      - "5000:5000"
    networks:
      - argofarm-network
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: argofarm-frontend
    ports:
      - "3000:80"
    networks:
      - argofarm-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: argofarm-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - argofarm-network
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  argofarm-network:
    driver: bridge