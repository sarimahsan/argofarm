<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArgoFarm — AI Crop Diagnostics</title>
  <meta name="description" content="ArgoFarm: AI-powered crop diagnostics and disease detection for Pakistani farmers. Scan crops, get treatment advisories, and optimize yields." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <div id="app"></div>
  <div class="toast-container" id="toastContainer"></div>
  <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)window.__closeModal&&window.__closeModal()">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">Details</h2>
        <button class="icon-btn" onclick="window.__closeModal&&window.__closeModal()" aria-label="Close">
          <i class="fas fa-xmark"></i>
        </button>
      </div>
      <div id="modalContent"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
